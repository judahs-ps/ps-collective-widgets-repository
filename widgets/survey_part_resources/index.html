<h2>Survey Participation Resources Table</h2>

<table id="jsonTable" class="display"></table>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
  (function () {
    // Use Gainsight's jQuery instance
    var $ = window.jQuery;

    // Example JSON dataset
    const tableData = [
      { id: 1, name: "Alice Johnson", role: "Admin", active: true },
      { id: 2, name: "Bob Smith", role: "Moderator", active: false },
      { id: 3, name: "Charlie Davis", role: "Member", active: true },
      { id: 4, name: "Dana Lee", role: "Member", active: true }
    ];

    // Build DataTables column definitions dynamically
    const columns = Object.keys(tableData[0]).map(key => ({
      title: key.charAt(0).toUpperCase() + key.slice(1),
      data: key
    }));

    $(document).ready(function () {
      $("#jsonTable").DataTable({
        data: tableData,
        columns: columns,
        pageLength: 5,
        searching: true
      });
    });
  })();
</script>
