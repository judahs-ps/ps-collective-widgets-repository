<script>
  (() => {
    fetch('/widget-service/connectors/random-dog-photo-connector/execute')
      .then(response => response.json())
      .then(data => {
        const photo = Array.isArray(data) ? data[0] : data;
        if (!photo?.urls) return;

        const unsplashContainer = document.querySelector('#unsplash');
        const image = document.createElement('img');
        image.src = photo.urls.regular;
        image.alt = photo.alt_description || 'doggo';
        unsplashContainer.replaceChildren(image);
      })
      .catch(err => console.error(err));
  })(); 
</script>

    display: block;
    max-width: 500px;
