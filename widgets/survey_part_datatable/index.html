<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js">
</script>

<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js">
</script>

<!-- DataTables CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

<h1>Searchable, Sortable Data Table</h1>

<table id="surveyDataTable" class="display" style="width:100%">
  <thead id="tableHead"></thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
  insided.widgets.onReady((widget) => {

    // JSONP callback
    window.loadSurveyPartData = function (data) {
      if (!Array.isArray(data) || data.length === 0) {
        console.warn("No survey data received");
        return;
      }

      const root = widget.root;

      const tableHead = root.querySelector("#tableHead");
      const tableBody = root.querySelector("#tableBody");

      if (!tableHead || !tableBody) {
        console.error("Table elements not found inside widget DOM");
        return;
      }

      // Build headers
      const headers = Object.keys(data[0]);
      tableHead.innerHTML = `
        <tr>
          ${headers.map(h => `<th>${h}</th>`).join("")}
        </tr>
      `;

      // Build rows
      tableBody.innerHTML = data
        .map(row => `
          <tr>
            ${headers.map(h => `<td>${row[h]}</td>`).join("")}
          </tr>
        `)
        .join("");

      // Initialize DataTables inside widget DOM
      $(root.querySelector("#surveyDataTable")).DataTable();
    };

    // Load JSONP file INSIDE the widget DOM
    const script = document.createElement("script");
    script.src = "https://connect.payscale.com/s/survey-part-data.js";
    widget.root.appendChild(script);

  });
</script>
