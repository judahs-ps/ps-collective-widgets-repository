<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js">
</script>

<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js">
</script>

<!-- DataTables CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

<h1>Searchable, Sortable Data Table</h1>

<table id="surveyDataTable" class="display" style="width:100%">
  <thead id="tableHead"></thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Confirm the data exists and is an array
    const data = window.surveyPartData;

    if (!Array.isArray(data) || data.length === 0) {
      console.warn("surveyPartData is empty or not an array");
      return;
    }

    // Build table headers dynamically
    const headers = Object.keys(data[0]);
    const thead = document.getElementById("tableHead");
    thead.innerHTML = `
      <tr>
        ${headers.map(h => `<th>${h}</th>`).join("")}
      </tr>
    `;

    // Build table rows
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = data
      .map(row => `
        <tr>
          ${headers.map(h => `<td>${row[h]}</td>`).join("")}
        </tr>
      `)
      .join("");

    // Initialize DataTables AFTER table is built
    $("#surveyDataTable").DataTable();
  });
</script>
